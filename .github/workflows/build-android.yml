name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g
  # These are Supabase public frontend values. Never put a service-role key here.
  # The anon key is intentionally public and RLS is the security boundary.
  VITE_SUPABASE_URL: https://wcnocnornerbiigcckzh.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indjbm9jbm9ybmVyYmlpZ2Nja3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MTE2MzMsImV4cCI6MjEwMzM4NzYzM30.Y6miUuW4iAN4_vYXM_qShIIEKev6YzSPOpoS4XnRsFY
  VITE_AGORA_APP_ID: ${{ secrets.VITE_AGORA_APP_ID }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Sync web bundle and native plugins
        run: pnpm exec cap sync android

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saki-chat-android-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Saki Chat ${{ github.ref_name }} — Production Release
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/saki-upload-cert.pem
